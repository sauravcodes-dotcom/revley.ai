services:
  postgres:
    image: postgres:16-alpine
    container_name: warrant-postgres
    environment:
      POSTGRES_USER: warrant
      POSTGRES_PASSWORD: warrant
      POSTGRES_DB: warrant
    ports:
      - "5433:5432"
    volumes:
      - warrant-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warrant -d warrant"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  warrant-pgdata:
